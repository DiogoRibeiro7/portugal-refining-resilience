[project]
name = "portugal-refining-resilience"
version = "0.1.0"
description = "Notebook-first analysis of Portugal refining capacity, fuel trade dependence, resilience and price transmission."
authors = [{ name = "Diogo Ribeiro" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.14"
keywords = ["energy", "portugal", "refining", "resilience", "petroleum", "notebooks"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "pandas>=2.2,<3.0",
    "numpy>=2.0,<3.0",
    "scipy>=1.14,<2.0",
    "statsmodels>=0.14,<0.15",
    "matplotlib>=3.9,<4.0",
    "requests>=2.32,<3.0",
    "beautifulsoup4>=4.12,<5.0",
    "lxml>=5.3,<6.0",
    "openpyxl>=3.1,<4.0",
    "pyarrow>=18.0,<19.0",
    "pyyaml>=6.0,<7.0",
    "jupyterlab>=4.3,<5.0",
    "nbclient>=0.10,<0.11",
    "nbformat>=5.10,<6.0",
]

[project.urls]
Homepage = "https://github.com/DiogoRibeiro7/portugal-refining-resilience"
Repository = "https://github.com/DiogoRibeiro7/portugal-refining-resilience"
Issues = "https://github.com/DiogoRibeiro7/portugal-refining-resilience/issues"

[tool.poetry]
packages = [{ include = "portugal_refining_resilience", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
ruff = "^0.8"
mypy = "^1.13"
pandas-stubs = "^2.2"
types-PyYAML = "^6.0"
types-requests = "^2.32"
pre-commit = "^4.0"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
packages = ["portugal_refining_resilience"]

[[tool.mypy.overrides]]
module = ["scipy.*", "statsmodels.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
